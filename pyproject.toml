[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hsk30"
version = "0.1.0"
description = "Grade Chinese text against the HSK 3.0 standard"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["chinese", "mandarin", "hsk", "readability", "language-learning", "cefr"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Chinese (Simplified)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/harukicoder/hsk30"
Source = "https://github.com/harukicoder/hsk30"
Issues = "https://github.com/harukicoder/hsk30/issues"

[project.scripts]
hsk30 = "hsk30.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hsk30 = ["data/*.tsv"]
